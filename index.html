<!DOCTYPE html>
<html>

<head>
    <title>FoodieApp - Food Delivery</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #ff5722;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 30px auto;
        }

        .food {
            background: white;
            padding: 20px;
            margin: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px #ccc;
        }

        button {
            background: #ff5722;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        #cart {
            background: white;
            padding: 20px;
            margin-top: 30px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🍔 FoodieApp</h1>
        <p>Online Food Delivery System</p>
    </header>

    <div class="container">

        <h2>Food Menu</h2>

        <input type="text" id="search" placeholder="Search food..." onkeyup="searchFood()">

        <div class="food">
            <h3>Pizza</h3>
            <p>Cheese Pizza - ₹250</p>
            <button onclick="addToCart('Pizza',250)">Add to Cart</button>
        </div>

        <div class="food">
            <h3>Burger</h3>
            <p>Cheese Burger - ₹150</p>
            <button onclick="addToCart('Burger',150)">Add to Cart</button>
        </div>

        <div class="food">
            <h3>Biryani</h3>
            <p>Chicken Biryani - ₹220</p>
            <button onclick="addToCart('Biryani',220)">Add to Cart</button>
        </div>

        <div class="food">
            <h3>Sandwich</h3>
            <p>Veg Sandwich - ₹120</p>
            <button onclick="addToCart('Sandwich',120)">Add to Cart</button>
        </div>

        <div id="cart">
            <h2>🛒 Cart</h2>
            <p id="cartItems">No items added.</p>
            <h3>Total: ₹<span id="total">0</span></h3>
            <button onclick="placeOrder()">Place Order</button>
        </div>

    </div>

    <script>

        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push(name);
            total += price;

            document.getElementById("cartItems").innerHTML =
                cart.join(", ");

            document.getElementById("total").innerHTML =
                total;
        }

        function placeOrder() {

            if (cart.length === 0) {
                alert("Please add food to cart first.");
                return;
            }

            alert("Order placed successfully!");
        }


        function searchFood() {

            let input =
                document.getElementById("search").value.toLowerCase();

            let foods =
                document.getElementsByClassName("food");

            for (let i = 0; i < foods.length; i++) {

                let text =
                    foods[i].innerText.toLowerCase();

                if (text.includes(input)) {
                    foods[i].style.display = "block";
                }
                else {
                    foods[i].style.display = "none";
                }
            }
        }

    </script>

</body>

</html>
